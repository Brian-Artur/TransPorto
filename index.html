<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora Transporte</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 500px;
        margin: 0 auto;
        padding: 20px;
      }
      h1 {
        text-align: center;
        color: #333;
      }
      .form-group {
        margin-bottom: 15px;
      }
      select,
      input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
      }
      button {
        background: #4285f4;
        color: white;
        border: none;
        padding: 10px;
        width: 100%;
        cursor: pointer;
      }
      #result {
        margin-top: 20px;
        padding: 15px;
        border: 1px solid #ddd;
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Calculadora de Transporte</h1>

    <div class="form-group">
      <label for="origin">Origen:</label>
      <select id="origin">
        <optgroup label="Ciudades Costeras">
          <option value="Bilbao">Bilbao</option>
          <option value="Vigo">Vigo</option>
          <option value="Cádiz">Cádiz</option>
          <option value="Valencia">Valencia</option>
          <option value="Barcelona">Barcelona</option>
        </optgroup>
        <optgroup label="Ciudades Interiores">
          <option value="Valladolid">Valladolid</option>
          <option value="Zaragoza">Zaragoza</option>
          <option value="Madrid">Madrid</option>
          <option value="Badajoz">Badajoz</option>
          <option value="Granada">Granada</option>
        </optgroup>
      </select>
    </div>

    <div class="form-group">
      <label for="destination">Destino:</label>
      <select id="destination">
        <optgroup label="Ciudades Costeras">
          <option value="Bilbao">Bilbao</option>
          <option value="Vigo">Vigo</option>
          <option value="Cádiz">Cádiz</option>
          <option value="Valencia">Valencia</option>
          <option value="Barcelona">Barcelona</option>
        </optgroup>
        <optgroup label="Ciudades Interiores">
          <option value="Valladolid">Valladolid</option>
          <option value="Zaragoza">Zaragoza</option>
          <option value="Madrid">Madrid</option>
          <option value="Badajoz">Badajoz</option>
          <option value="Granada">Granada</option>
        </optgroup>
      </select>
    </div>

    <div class="form-group">
      <label for="weight">Peso (toneladas):</label>
      <input type="number" id="weight" min="0.1" step="0.1" value="1" />
    </div>

    <button onclick="calculateCost()">Calcular Coste</button>

    <div id="result"></div>

    <script src="app/app.js"></script>
  </body>
</html>
