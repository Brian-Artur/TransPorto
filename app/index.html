<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Calculador de transporte</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }
      label {
        display: block;
        margin: 0.5rem 0 0.2rem;
      }
      select,
      input[type="number"] {
        padding: 0.4rem;
        width: 200px;
      }
      button {
        margin-top: 1rem;
        padding: 0.5rem 1rem;
      }
      #resultado {
        margin-top: 1.5rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Coste de transporte España</h1>

    <label for="origen">Ciudad origen</label>
    <select id="origen"></select>

    <label for="destino">Ciudad destino</label>
    <select id="destino"></select>

    <label for="tons">Toneladas</label>
    <input id="tons" type="number" min="0.1" step="0.1" placeholder="Ej. 12" />

    <button id="calc">Calcular opción más barata</button>

    <div id="resultado"></div>

    <!--  Enlaza el JS compilado desde transport.ts  -->
    <script type="module">
      import { Transport, City } from './transport.js';   // ← salida de tsc

      const cities = [
        "A Coruña","Barcelona","Valencia","Bilbao","Cádiz",
        "Madrid","Zaragoza","Valladolid","Granada","Burgos"
      ];

      const origenSel  = document.getElementById('origen');
      const destinoSel = document.getElementById('destino');

      // Rellenar selects
      for (const c of cities) {
        origenSel.append(new Option(c, c));
        destinoSel.append(new Option(c, c));
      }

      const t = new Transport();

      document.getElementById('calc').addEventListener('click', () => {
        const origen = origenSel.value as City;
        const destino = destinoSel.value as City;
        const tons = parseFloat((document.getElementById('tons') as HTMLInputElement).value);

        const resBox = document.getElementById('resultado');
        resBox.textContent = '';

        if (!origen || !destino) {
          resBox.textContent = '⚠️ Selecciona origen y destino.';
          return;
        }
        if (!tons || tons <= 0) {
          resBox.textContent = '⚠️ Introduce toneladas válidas.';
          return;
        }

        try {
          const r = t.calcularMasBarato(tons, origen, destino);
          resBox.textContent =
            `🛣️ Tipo: ${r.tipo}` +
            (r.intermedia ? `  (intermedia: ${r.intermedia})\n` : '\n') +
            `Coste terrestre:  €${r.costeTerrestre.toFixed(2)}\n` +
            `Coste marítimo:   €${r.costeMarítimo.toFixed(2)}\n` +
            `━━━━━━━━━━━━━━━━━━━━━━\n` +
            `Coste TOTAL:       €${r.costeTotal.toFixed(2)}\n` +
            `Vehículos:         ${r.vehiculosTerrestres}`;
        } catch (err) {
          resBox.textContent = '❌ ' + err.message;
        }
      });
    </script>
  </body>
</html>
